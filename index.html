<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="一目">
<meta name="theme-color" content="#185FA5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>一目</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#f5f4f0;min-height:100vh;padding-bottom:100px;-webkit-user-select:none;user-select:none}
.app{max-width:480px;margin:0 auto}

/* 微信提示条 */
.wx-tip{background:#FF6B35;color:#fff;padding:12px 16px;font-size:13px;text-align:center;display:none;line-height:1.6}
.wx-tip.show{display:block}
.wx-tip b{font-size:14px}

/* 安装按钮 */
.install-bar{margin:10px 14px 0;background:#eaf3fd;border:0.5px solid #b5d4f4;border-radius:10px;padding:10px 14px;display:none;align-items:center;justify-content:space-between}
.install-bar.show{display:flex}
.install-bar span{font-size:12px;color:#185FA5}
.install-btn{font-size:12px;color:#fff;background:#185FA5;border:none;border-radius:7px;padding:6px 12px;cursor:pointer;font-family:inherit;white-space:nowrap}

/* 顶部 */
.topbar{background:#fff;padding:env(safe-area-inset-top,0) 0 0;position:sticky;top:0;z-index:20;border-bottom:0.5px solid #e8e6df}
.topbar-inner{padding:14px 16px 12px}
.topbar-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.topbar-title{font-size:17px;font-weight:600;color:#1a1a1a}
.topbar-date{font-size:12px;color:#999}
.topbar-actions{display:flex;gap:8px;align-items:center}
.btn-sm{font-size:12px;color:#666;background:none;border:0.5px solid #ddd;border-radius:8px;padding:5px 10px;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-sm:active{background:#f0ede6}

/* 统计 */
.stats{display:flex;gap:0;margin-top:10px;background:#f8f7f3;border-radius:10px;overflow:hidden}
.stat{flex:1;text-align:center;padding:8px 4px}
.stat+.stat{border-left:0.5px solid #e8e6df}
.stat-num{font-size:18px;font-weight:600;line-height:1}
.stat-label{font-size:11px;color:#999;margin-top:2px}

/* 今日到期提醒条 */
.alert-bar{margin:10px 14px 0;background:#fff8e6;border:0.5px solid #f5d37a;border-radius:10px;padding:9px 12px;font-size:12px;color:#7a5800;display:none}
.alert-bar.show{display:block}
.alert-title{font-weight:500;margin-bottom:4px}
.alert-items{line-height:1.8}

/* 通知横幅 */
.notif-banner{margin:10px 14px 0;background:#eaf3fd;border:0.5px solid #b5d4f4;border-radius:10px;padding:9px 12px;display:none;align-items:center;justify-content:space-between;font-size:12px;color:#185FA5}
.notif-banner.show{display:flex}
.notif-btn{font-size:12px;color:#fff;background:#185FA5;border:none;border-radius:7px;padding:5px 10px;cursor:pointer;font-family:inherit;white-space:nowrap}

/* 栏目 */
.section{margin:10px 14px 0;background:#fff;border-radius:14px;overflow:hidden;border:0.5px solid #e8e6df}
.sec-header{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer}
.sec-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.sec-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sec-name{font-size:14px;font-weight:500;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-badge{font-size:11px;color:#999;background:#f1efe8;border-radius:10px;padding:1px 7px;margin-left:2px;flex-shrink:0}
.sec-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.sec-urgent{font-size:11px;color:#E24B4A;background:#fff0f0;border-radius:8px;padding:1px 7px;display:none}
.sec-urgent.show{display:inline-block}
.sec-menu{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;color:#bbb;cursor:pointer;flex-shrink:0;position:relative;z-index:1}
.sec-menu:active{background:#f0ede6}
.chevron{font-size:11px;color:#bbb;transition:transform .2s;display:inline-block}
.chevron.open{transform:rotate(180deg)}

/* 进度条 */
.prog{height:2px;background:#f1efe8}
.prog-fill{height:100%;transition:width .3s}

/* 子栏目 */
.sub-sec{margin:0 12px 8px;background:#fafaf7;border-radius:10px;overflow:hidden;border:0.5px solid #eeebe5}
.sub-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer}
.sub-left{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.sub-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sub-name{font-size:13px;font-weight:500;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-badge{font-size:10px;color:#999;background:#ebeaE3;border-radius:8px;padding:1px 6px;flex-shrink:0}
.sub-menu{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#bbb;cursor:pointer;flex-shrink:0;position:relative;z-index:1}
.sub-menu:active{background:#e9e7de}
.sub-chevron{font-size:10px;color:#bbb;transition:transform .2s;display:inline-block}
.sub-chevron.open{transform:rotate(180deg)}

/* 任务行 */
.task-list{border-top:0.5px solid #f0ede6}
.task-list.sub{border-top:0.5px solid #e5e3db}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-bottom:0.5px solid #f7f5f0;position:relative;min-height:44px}
.task-row:last-child{border-bottom:none}
.task-row.overdue{background:#fff8f8}
.task-row.due-today{background:#fffbf0}
.task-check{width:22px;height:22px;border-radius:50%;border:1.5px solid;flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#fff;position:relative}
.task-check.done{border-color:var(--sec-c)!important;background:var(--sec-c)}
.task-check.done::after{content:'';position:absolute;width:10px;height:6px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.task-body{flex:1;min-width:0}
.task-text{font-size:14px;color:#1a1a1a;line-height:1.5;word-break:break-all;outline:none;min-height:21px}
.task-text.done{text-decoration:line-through;color:#bbb}
.task-due{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:11px}
.due-label{color:#999}
.due-date{color:#999;cursor:pointer;padding:2px 8px;background:#f5f4f0;border-radius:5px;border:0.5px solid #e0ddd6;font-size:11px}
.due-date.overdue{color:#E24B4A;background:#fff0f0;border-color:#f5c0c0;font-weight:500}
.due-date.today{color:#BA7517;background:#fff8e6;border-color:#f5d37a;font-weight:500}
.task-del{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:22px;color:#ccc;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;line-height:1}
.task-del:active{background:#f0ede6;color:#999}
.task-up{position:absolute;right:42px;top:50%;transform:translateY(-50%);font-size:17px;color:#c5c5c5;width:28px;height:28px;display:none;align-items:center;justify-content:center;border-radius:50%;line-height:1;cursor:pointer}
.task-up.show{display:flex}
.task-up:active{background:#e8f0f8;color:#185FA5}

.empty-hint{padding:20px 14px;font-size:13px;color:#ccc;text-align:center}

/* 添加栏 */
.add-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:0.5px solid #f0ede6}
.add-bar.sub{border-top:0.5px solid #e5e3db;padding:7px 10px}
.add-inp{flex:1;border:none;outline:none;font-size:14px;color:#1a1a1a;background:transparent;font-family:inherit;padding:4px 0;-webkit-appearance:none}
.add-inp::placeholder{color:#ccc}
.add-date-btn{font-size:12px;color:#999;background:#f5f4f0;border:0.5px solid #e0ddd6;border-radius:7px;padding:5px 8px;cursor:pointer;white-space:nowrap;font-family:inherit;-webkit-appearance:none;flex-shrink:0}
.add-date-btn.has-date{color:#185FA5;border-color:#b5d4f4;background:#eaf3fd}
.add-submit{font-size:13px;color:#fff;border:none;cursor:pointer;padding:7px 14px;border-radius:8px;font-family:inherit;white-space:nowrap;flex-shrink:0;-webkit-appearance:none}

/* 新建子栏目按钮 */
.new-sub-btn{display:flex;align-items:center;gap:4px;padding:8px 14px;font-size:12px;color:#999;cursor:pointer;border-top:0.5px solid #f0ede6}
.new-sub-btn:active{background:#fafaf7}
.new-sub-plus{font-size:15px;font-weight:300;line-height:1}

/* 底部新建栏目按钮 */
.bottom-bar{margin:14px;text-align:center}
.btn-new-sec{font-size:14px;color:#185FA5;background:#fff;border:1px dashed #b5d4f4;border-radius:12px;padding:12px;width:100%;cursor:pointer;font-family:inherit;-webkit-appearance:none}
.btn-new-sec:active{background:#eaf3fd}

/* 日期选择器 */
.date-picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;display:none;align-items:flex-end;justify-content:center}
.date-picker-overlay.show{display:flex}
.date-picker-box{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0))}
.dpc-title{font-size:15px;font-weight:500;margin-bottom:16px;color:#1a1a1a}
.dpc-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dpc-chip{font-size:13px;padding:7px 14px;border-radius:20px;border:0.5px solid #e0ddd6;cursor:pointer;color:#555;background:#fff;font-family:inherit;-webkit-appearance:none}
.dpc-chip.sel{background:#185FA5;color:#fff;border-color:#185FA5}
.dpc-custom{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.dpc-custom label{font-size:13px;color:#666;white-space:nowrap}
.dpc-custom input{flex:1;font-size:14px;border:0.5px solid #ddd;border-radius:8px;padding:8px 10px;outline:none;font-family:inherit;color:#1a1a1a;-webkit-appearance:none}
.dpc-actions{display:flex;gap:10px}
.dpc-cancel{flex:1;font-size:14px;color:#666;background:#f5f4f0;border:none;border-radius:10px;padding:12px;cursor:pointer;font-family:inherit}
.dpc-confirm{flex:2;font-size:14px;color:#fff;background:#185FA5;border:none;border-radius:10px;padding:12px;cursor:pointer;font-family:inherit}

/* 编辑栏目弹窗 */
.edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:110;display:none;align-items:center;justify-content:center}
.edit-overlay.show{display:flex}
.edit-box{background:#fff;width:calc(100% - 40px);max-width:400px;border-radius:16px;padding:24px 20px 20px}
.edit-title{font-size:16px;font-weight:600;color:#1a1a1a;margin-bottom:16px}
.edit-label{font-size:12px;color:#999;margin-bottom:6px}
.edit-input{width:100%;font-size:15px;border:0.5px solid #ddd;border-radius:10px;padding:10px 12px;outline:none;font-family:inherit;color:#1a1a1a;margin-bottom:14px;-webkit-appearance:none}
.edit-input:focus{border-color:#185FA5}

/* 颜色选择 */
.color-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.color-chip{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;position:relative;flex-shrink:0}
.color-chip.sel{border-color:#1a1a1a;box-shadow:0 0 0 2px #fff inset}
.color-chip::after{content:'';display:none;position:absolute;inset:3px;border-radius:50%;border:2px solid #fff}
.color-chip.sel::after{display:block}

.edit-actions{display:flex;gap:10px}
.edit-cancel{flex:1;font-size:14px;color:#666;background:#f5f4f0;border:none;border-radius:10px;padding:12px;cursor:pointer;font-family:inherit}
.edit-confirm{flex:2;font-size:14px;color:#fff;background:#185FA5;border:none;border-radius:10px;padding:12px;cursor:pointer;font-family:inherit}
.edit-delete{flex:1;font-size:13px;color:#E24B4A;background:#fff;border:1px solid #E24B4A;border-radius:10px;padding:12px;cursor:pointer;font-family:inherit;margin-right:10px}

/* 栏目菜单弹层 */
.sec-popup{position:fixed;z-index:105;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);overflow:hidden;display:none;min-width:120px}
.sec-popup.show{display:block}
.sec-popup-item{padding:12px 16px;font-size:14px;color:#1a1a1a;cursor:pointer;display:flex;align-items:center;gap:8px}
.sec-popup-item:active{background:#f5f4f0}
.sec-popup-item.danger{color:#E24B4A}
.sec-popup-item+.sec-popup-item{border-top:0.5px solid #f0ede6}
</style>

<script>
(function(){
'use strict';

/* ================================================================
   颜色预设
   ================================================================ */
var COLOR_PALETTE = [
  {name:'宝蓝', color:'#185FA5', dot:'#378ADD'},
  {name:'绯红', color:'#A32D2D', dot:'#E24B4A'},
  {name:'松绿', color:'#3B6D11', dot:'#639922'},
  {name:'赭石', color:'#7c5500', dot:'#BA7517'},
  {name:'绛紫', color:'#6B21A8', dot:'#A855F7'},
  {name:'黛青', color:'#0D9488', dot:'#2DD4BF'},
  {name:'赤橙', color:'#C2410C', dot:'#F97316'},
  {name:'桃红', color:'#BE185D', dot:'#F472B6'}
];

var DEFAULT_SECTIONS = [
  {id:'sec_1',name:'诉讼仲裁',color:'#A32D2D',dot:'#E24B4A'},
  {id:'sec_2',name:'顾问单位',color:'#185FA5',dot:'#378ADD'},
  {id:'sec_3',name:'非诉业务',color:'#3B6D11',dot:'#639922'},
  {id:'sec_4',name:'行政事务',color:'#7c5500',dot:'#BA7517'},
  {id:'sec_5',name:'个人事项',color:'#6B21A8',dot:'#A855F7'}
];

/* ================================================================
   微信检测
   ================================================================ */
var ua=navigator.userAgent||'';
if(/MicroMessenger/i.test(ua)){
  document.getElementById('wx-tip').classList.add('show');
}

/* ================================================================
   日期工具
   ================================================================ */
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function pad(n){return String(n).padStart(2,'0');}
function formatDue(s){
  if(!s)return '';
  var parts=s.split('-');
  return Number(parts[1])+'月'+Number(parts[2])+'日';
}
function dueStat(s){
  if(!s)return 'none';
  var today=todayStr();
  if(s<today)return 'overdue';
  if(s===today)return 'today';
  return 'ok';
}
function getWeek(){
  return ['日','一','二','三','四','五','六'][new Date().getDay()];
}
function addDays(n){
  var d=new Date();
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function getDateStr(){
  var d=new Date();
  return (d.getMonth()+1)+'月'+d.getDate()+'日 · 周'+getWeek();
}

/* ================================================================
   数据管理
   ================================================================ */
var STORAGE_KEY='lawfirm_v7';
var _idCounter=0;

function newId(prefix){
  return prefix+'_'+Date.now()+'_'+(++_idCounter);
}

function loadData(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return null;
    var d=JSON.parse(raw);
    // 迁移旧数据
    if(!d.sections && d.tasks){
      d=migrateOldData(d);
    }
    return d;
  }catch(e){return null;}
}

function migrateOldData(old){
  var mig=[];
  var oldMap=[
    {oid:'client', name:'老客户服务', color:'#185FA5', dot:'#378ADD'},
    {oid:'focus',  name:'重点跟进',   color:'#A32D2D', dot:'#E24B4A'},
    {oid:'other',  name:'其他工作',   color:'#3B6D11', dot:'#639922'},
    {oid:'priv',   name:'私人事项',   color:'#7c5500', dot:'#BA7517'}
  ];
  oldMap.forEach(function(m){
    var tasks=old.tasks[m.oid]||[];
    if(tasks.length>0){
      mig.push({id:newId('sec'),name:m.name,color:m.color,dot:m.dot,tasks:tasks,subs:[]});
    }
  });
  // 如果旧数据没有任何任务，返回默认
  if(mig.length===0){
    return createDefaultData();
  }
  return {sections:mig,collapsedSec:{},collapsedSub:{}};
}

function createDefaultData(){
  var now=Date.now();
  function task(text){
    return {text:text,done:false,due:'',ts:now++};
  }
  function sub(id,name,taskList){
    return {id:id,name:name,tasks:taskList};
  }
  return {

  {label:'本周五',fn:function(){
    var d=new Date(),diff=(5-d.getDay()+7)%7||7;
    d.setDate(d.getDate()+diff);
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }},

      el.classList.add('sel');

    data.sections[editSecIdx].subs[editSubIdx].name=name;
  }else if(editMode==='new'){

    var c=COLOR_PALETTE[editColorIdx];
    data.sections.push({id:newId('sec'),name:name,color:c.color,dot:c.dot,tasks:[],subs:[]});
  }else{

    var c=COLOR_PALETTE[editColorIdx];

    data.sections[editSecIdx].color=c.color;

function deleteSection(){
  if(editSubIdx>=0){
    if(!confirm('删除子栏目「'+data.sections[editSecIdx].subs[editSubIdx].name+'」及其所有任务？'))return;
    data.sections[editSecIdx].subs.splice(editSubIdx,1);

    if(!sec)return;
    var hasTasks=sec.tasks.length>0||(sec.subs||[]).some(function(s){return s.tasks.length>0;});

    if(!confirm(msg))return;
    data.sections.splice(editSecIdx,1);

  render();
}

   ================================================================ */
function dismissNotifBanner(){
  localStorage.setItem('notif_dismissed','1');
  document.getElementById('notif-banner').classList.remove('show');
}
function requestNotif(){
  if(!('Notification' in window)){
    alert('此浏览器不支持通知功能');
    return;
  }
  Notification.requestPermission().then(function(p){
    if(p==='granted'){
      dismissNotifBanner();
      scheduleNotifications();
    }else{
      alert('请在浏览器设置中允许通知权限');
    }
  });
}
function scheduleNotifications(){
  if(!('Notification' in window))return;
  if(Notification.permission!=='granted')return;
  var today=todayStr();
  data.sections.forEach(function(sec){
    // 栏目直挂任务
    (sec.tasks||[]).forEach(function(t){
      scheduleOne(sec.name,t);
    });
    // 子栏目任务
    (sec.subs||[]).forEach(function(sub){
      (sub.tasks||[]).forEach(function(t){
        scheduleOne(sec.name+'·'+sub.name,t);
      });
    });
  });
  function scheduleOne(label,t){
    if(!t.done&&t.due&&t.due>=today){
      var dueTime=new Date(t.due+'T09:00:00').getTime();
      var notifTime=dueTime-3600000;
      var now=Date.now();
      if(notifTime>now&&notifTime-now<86400000){
        setTimeout(function(){
          try{
            new Notification('【'+label+'】即将到期',{
              body:t.text||'任务到期',
              icon:'icon-192.png',
              tag:t.ts||''
            });
          }catch(e){}
        },notifTime-now);
      }
    }
  }
}

/* ================================================================
   统计 & 提醒条
   ================================================================ */
function escapeHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function forEachTask(fn){
  data.sections.forEach(function(sec){
    (sec.tasks||[]).forEach(function(t){fn(t,sec);});
    (sec.subs||[]).forEach(function(sub){
      (sub.tasks||[]).forEach(function(t){fn(t,sec);});
    });
  });
}

function updateStats(){
  var today=todayStr();
  var total=0,done=0,overdue=0;
  forEachTask(function(t){
    total++;
    if(t.done)done++;
    else if(t.due&&t.due<today)overdue++;
  });
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-done').textContent=done;
  document.getElementById('st-remain').textContent=total-done;
  document.getElementById('st-overdue').textContent=overdue;
}

function updateAlertBar(){
  var today=todayStr();
  var items=[];
  data.sections.forEach(function(sec){
    (sec.tasks||[]).forEach(function(t){
      if(!t.done&&t.due===today)items.push('<span style="color:'+sec.dot+'">■</span> '+escapeHtml(t.text));
    });
    (sec.subs||[]).forEach(function(sub){
      (sub.tasks||[]).forEach(function(t){
        if(!t.done&&t.due===today)items.push('<span style="color:'+sec.dot+'">■</span> '+escapeHtml(sub.name+'：'+t.text));
      });
    });
  });
  var bar=document.getElementById('alert-bar');
  var list=document.getElementById('alert-items');
  if(items.length){
    list.innerHTML=items.join('<br>');
    bar.classList.add('show');
  }else{
    bar.classList.remove('show');
  }
}

function secTaskCount(sec){
  var c=sec.tasks.length;
  (sec.subs||[]).forEach(function(s){c+=s.tasks.length;});
  return c;
}
function secDoneCount(sec){
  var c=sec.tasks.filter(function(t){return t.done;}).length;
  (sec.subs||[]).forEach(function(s){c+=s.tasks.filter(function(t){return t.done;}).length;});
  return c;
}
function secOverdueCount(sec){
  var today=todayStr();
  var c=sec.tasks.filter(function(t){return !t.done&&t.due&&t.due<today;}).length;
  (sec.subs||[]).forEach(function(s){c+=s.tasks.filter(function(t){return !t.done&&t.due&&t.due<today;}).length;});
  return c;
}

function clearDoneAll(){
  var hasDone=false;
  forEachTask(function(t){if(t.done)hasDone=true;});
  if(!hasDone){alert('没有已完成的任务');return;}
  if(!confirm('清除所有已完成的任务？'))return;
  data.sections.forEach(function(sec){
    sec.tasks=(sec.tasks||[]).filter(function(t){return !t.done;});
    (sec.subs||[]).forEach(function(sub){
      sub.tasks=(sub.tasks||[]).filter(function(t){return !t.done;});
    });
  });
  render();
}

var addState={}; // 格式: { 'sec_id':{text,due}, 'sub_id':{text,due} }

function getAddState(id){
  if(!addState[id])addState[id]={text:'',due:''};
  return addState[id];
}

function render(){
  saveData(data);
  updateStats();
  updateAlertBar();
  var today=todayStr();
  var main=document.getElementById('main');
  main.innerHTML='';

  data.sections.forEach(function(sec,si){
    var secIsOpen=data.collapsedSec[sec.id]!==true;
    var totalCount=secTaskCount(sec);
    var doneCount=secDoneCount(sec);
    var overdueCount=secOverdueCount(sec);
    var pct=totalCount?Math.round(doneCount/totalCount*100):0;

    var wrap=document.createElement('div');
    wrap.className='section';

    /* ---- 栏目头部 ---- */
    var hdr=document.createElement('div');

      '<div class="sec-right">'+

      '</div>';

    hdr.addEventListener('click',function(e){
      if(e.target.closest('.sec-menu'))return;
      data.collapsedSec[sec.id]=secIsOpen;
      render();
    });
    // 菜单按钮
    hdr.querySelector('.sec-menu').addEventListener('click',function(e){
      showPopup(si,-1,e);
    });
    wrap.appendChild(hdr);

    /* 进度条 */
    if(totalCount>0){
      var pt=document.createElement('div');
      pt.className='prog';
      pt.innerHTML='<div class="prog-fill" style="width:'+pct+'%;background:'+sec.dot+'"></div>';
      wrap.appendChild(pt);
    }

    /* ---- 展开内容 ---- */
    if(secIsOpen){
      var inner=document.createElement('div');

      /* -- 栏目直挂任务 -- */
      renderTaskList(inner, sec.tasks, sec, sec.id, 'sec', si, -1);

      /* -- 子栏目 -- */
      (sec.subs||[]).forEach(function(sub,subi){
        var subIsOpen=data.collapsedSub[sub.id]!==true;
        var subTotal=sub.tasks.length;
        var subDone=sub.tasks.filter(function(t){return t.done;}).length;
        var subOverdue=sub.tasks.filter(function(t){return !t.done&&t.due&&t.due<today;}).length;

        var subWrap=document.createElement('div');
        subWrap.className='sub-sec';

        var subHdr=document.createElement('div');

            '<div class="sub-dot" style="background:'+sec.dot+'"></div>'+
            '<span class="sub-name">'+escapeHtml(sub.name)+'</span>'+
            '<span class="sub-badge">'+subDone+'/'+subTotal+'</span>'+
          '</div>'+
          '<div class="sub-right" style="display:flex;align-items:center;gap:4px">'+
            '<span class="sec-urgent'+(subOverdue?' show':'')+'" style="font-size:10px">逾期 '+subOverdue+'</span>'+
            '<div class="sub-menu" data-action="menu">⋯</div>'+

        subHdr.addEventListener('click',function(e){

        });

        inner.appendChild(subWrap);
      });

        var eh=document.createElement('div');

      });

  bb.innerHTML='<button class="btn-new-sec" onclick="openEditNew()">＋ 新建栏目</button>';

/* ---- 渲染任务列表 ---- */
function renderTaskList(container, tasks, sec, addStateId, type, si, subi){
  var today=todayStr();
  if(!tasks||tasks.length===0)return;

  var tl=document.createElement('div');
  tl.className='task-list'+(type==='sub'?' sub':'');

  // 排序：未完成在前，已完成在后；组内保持数组原始顺序
  var sorted=tasks.map(function(t,i){return {idx:i,data:t};});
  sorted.sort(function(a,b){
    if(a.data.done !== b.data.done) return a.data.done ? 1 : -1;
    return 0;
  });

  sorted.forEach(function(item, sortIdx){
    var i=item.idx;
    var t=item.data;
    var ds=dueStat(t.due);
    var row=document.createElement('div');
    row.className='task-row'+(ds==='overdue'&&!t.done?' overdue':ds==='today'&&!t.done?' due-today':'');

    // 勾选圆
    var chk=document.createElement('div');
    chk.className='task-check'+(t.done?' done':'');
    chk.style.cssText='border-color:'+sec.dot+';--sec-c:'+sec.dot;
    chk.addEventListener('click',function(){
      t.done=!t.done;
      render();
    });

    // 内容
    var body=document.createElement('div');
    body.className='task-body';

    var txt=document.createElement('div');
    txt.className='task-text'+(t.done?' done':'');
    txt.contentEditable=true;
    txt.textContent=t.text;
    txt.addEventListener('blur',function(){
      var v=txt.textContent.trim();
      if(v){t.text=v;saveData(data);}
      else{
        // 删除空文本的任务
        var arr=(type==='sub'?data.sections[si].subs[subi].tasks:data.sections[si].tasks);
        arr.splice(i,1);
        render();
      }
    });
    txt.addEventListener('keydown',function(e){
      if(e.key==='Enter'){e.preventDefault();txt.blur();}
    });

    // 到期日
    var dueRow=document.createElement('div');
    dueRow.className='task-due';
    dueRow.innerHTML='<span class="due-label">到期：</span>';
    var dueBtn=document.createElement('span');
    dueBtn.className='due-date'+(ds==='overdue'&&!t.done?' overdue':ds==='today'&&!t.done?' today':'');
    if(t.due){
      if(ds==='overdue'&&!t.done)dueBtn.textContent=formatDue(t.due)+' 已逾期';
      else if(ds==='today'&&!t.done)dueBtn.textContent=formatDue(t.due)+' 今天到期';
      else dueBtn.textContent=formatDue(t.due);
    }else{
      dueBtn.textContent='设置到期日';
    }
    dueBtn.addEventListener('click',function(){
      openDpc(t.due,function(newDate){
        t.due=newDate||'';
        render();
        scheduleNotifications();
      });
    });
    dueRow.appendChild(dueBtn);
    body.appendChild(txt);
    body.appendChild(dueRow);

    // 置顶按钮
    var showUp=!t.done && sortIdx>0 && !sorted[sortIdx-1].data.done;
    var upBtn=document.createElement('div');
    upBtn.className='task-up'+(showUp?' show':'');
    upBtn.textContent='∧';
    upBtn.addEventListener('click',function(){
      var arr=(type==='sub'?data.sections[si].subs[subi].tasks:data.sections[si].tasks);
      moveTaskUp(arr,i);
      render();
    });

    // 删除
    var del=document.createElement('div');
    del.className='task-del';
    del.textContent='×';
    del.addEventListener('click',function(){
      var arr=(type==='sub'?data.sections[si].subs[subi].tasks:data.sections[si].tasks);
      arr.splice(i,1);
      render();
    });

    row.appendChild(chk);row.appendChild(body);row.appendChild(upBtn);row.appendChild(del);
    tl.appendChild(row);
  });

  container.appendChild(tl);
}

/* ---- 任务置顶：移到同组（未完成/已完成）最前面 ---- */
function moveTaskUp(arr, idx){
  if(idx<=0)return;
  var t=arr[idx];
  var target=idx;
  for(var k=idx-1;k>=0;k--){
    if(arr[k].done===t.done){target=k;}
    else{break;}
  }
  if(target===idx)return;
  arr.splice(idx,1);
  arr.splice(target,0,t);
}

/* ---- 渲染添加栏 ---- */
function renderAddBar(container, addStateId, dotColor, tasksArr, type, si){
  var st=getAddState(addStateId);
  var bar=document.createElement('div');
  bar.className='add-bar'+(type==='sub'?' sub':'');

  var inp=document.createElement('input');
  inp.className='add-inp';
  inp.placeholder='新增任务…';
  inp.value=st.text||'';
  inp.addEventListener('input',function(e){
    st.text=e.target.value;
  });

  var dateBtn=document.createElement('button');
  dateBtn.className='add-date-btn'+(st.due?' has-date':'');
  dateBtn.textContent=st.due?formatDue(st.due):'日期';
  dateBtn.addEventListener('click',function(){
    openDpc(st.due,function(nd){
      st.due=nd||'';
      render();
      setTimeout(function(){
        var bars=document.querySelectorAll('.section .add-inp');
        for(var k=0;k<bars.length;k++){
          if(bars[k]===inp){bars[k].focus();break;}
        }
      },50);
    });
  });

  var submitBtn=document.createElement('button');
  submitBtn.className='add-submit';
  submitBtn.style.background=dotColor;
  submitBtn.textContent='添加';

  function doAdd(){
    var v=inp.value.trim();
    if(!v)return;
    tasksArr.unshift({text:v,done:false,due:st.due||'',ts:Date.now()});
    st.text='';st.due='';
    render();
    scheduleNotifications();
  }
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter')doAdd();
  });
  submitBtn.addEventListener('click',doAdd);

  bar.appendChild(inp);bar.appendChild(dateBtn);bar.appendChild(submitBtn);
  container.appendChild(bar);
}

/* ---- 新建子栏目对话框 ---- */
function openNewSubDialog(si){
  var name=prompt('请输入子栏目名称：');
  if(!name||!name.trim())return;
  name=name.trim();
  data.sections[si].subs.push({id:newId('sub'),name:name,tasks:[]});
  render();
}
